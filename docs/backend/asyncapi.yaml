asyncapi: 2.6.0
info:
  title: Burger Cafe Demo Feeds
  version: 1.0.0
  description: Server-to-client order feed snapshots. Clients send no application messages.
servers:
  local:
    url: localhost:3000
    protocol: ws
    description: Local HTTP/WebSocket server.
channels:
  /orders/all:
    description: Public feed containing all orders.
    subscribe:
      operationId: receivePublicFeed
      message:
        $ref: '#/components/messages/FeedSnapshot'
  /orders:
    description: Private feed containing orders belonging to the authenticated user.
    bindings:
      ws:
        query:
          type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              type: string
              description: Access JWT without the Bearer prefix.
    subscribe:
      operationId: receivePrivateFeed
      message:
        oneOf:
          - $ref: '#/components/messages/FeedSnapshot'
          - $ref: '#/components/messages/AuthenticationError'
components:
  messages:
    FeedSnapshot:
      name: FeedSnapshot
      payload:
        $ref: '#/components/schemas/Feed'
    AuthenticationError:
      name: AuthenticationError
      payload:
        $ref: '#/components/schemas/AuthenticationError'
  schemas:
    Order:
      type: object
      additionalProperties: false
      required: [_id, ingredients, status, name, number, createdAt, updatedAt]
      properties:
        _id: { type: string }
        ingredients:
          type: array
          items: { type: string }
        status: { type: string, enum: [created, pending, done, canceled] }
        name: { type: string }
        number: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Feed:
      type: object
      additionalProperties: false
      required: [success, orders, total, totalToday]
      properties:
        success: { const: true }
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        total: { type: integer, minimum: 0 }
        totalToday: { type: integer, minimum: 0 }
    AuthenticationError:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { const: false }
        message: { const: Invalid or missing token }
